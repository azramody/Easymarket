name: Daily episodes

on:
  schedule:
    # 09:15 UTC = 4:15am EST / 5:15am EDT. GitHub can start scheduled jobs late,
    # so this leaves time to finish before the 7am ET notification.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD), blank = today in New York"
        required: false
      force:
        description: "Rebuild even if the episode exists"
        type: boolean
        default: false

concurrency:
  group: daily-episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Kokoro voice model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: pipeline/assets/kokoro
          key: kokoro-v1.0

      - name: Download Kokoro voice model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets/kokoro
          curl -fsSL -o assets/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o assets/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Build episodes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          if [ -n "$INPUT_DATE" ]; then ARGS+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
          python -m easymarket.main "${ARGS[@]}"

